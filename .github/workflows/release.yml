name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 1.6.1"
        required: true
        type: string
      target_ref:
        description: "Branch, tag, or commit to package"
        required: false
        default: "main"
        type: string
      prerelease:
        description: "Mark this GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean
      make_latest:
        description: "Mark this release as latest"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate sources
        run: |
          python -m compileall app.py gpu_agent.py i18n.py
          python .github/scripts/frontend_ci_check.py

      - name: Build release package and manifest
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][A-Za-z0-9]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          tag="v${VERSION}"
          package_name="ipmi-web-${VERSION}.zip"
          manifest_name="ipmi-web-${VERSION}.manifest.json"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          package_url="https://github.com/${REPOSITORY}/releases/download/${tag}/${package_name}"

          mkdir -p dist
          git archive --format=zip --output="dist/${package_name}" HEAD
          sha256="$(sha256sum "dist/${package_name}" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$package_name" > "dist/${package_name}.sha256"

          export VERSION TAG PACKAGE_NAME="$package_name" PACKAGE_URL="$package_url" SHA256="$sha256" COMMIT_SHA="$commit_sha" SHORT_SHA="$short_sha"
          python -c "import json, os; manifest={'version':os.environ['VERSION'],'tag':os.environ['TAG'],'channel':'release','commit':os.environ['COMMIT_SHA'],'short_commit':os.environ['SHORT_SHA'],'package':{'name':os.environ['PACKAGE_NAME'],'url':os.environ['PACKAGE_URL'],'sha256':os.environ['SHA256'],'format':'zip'},'generated_by':'release.yml'}; path='dist/ipmi-web-%s.manifest.json'%os.environ['VERSION']; open(path,'w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          COMMIT_SHA: ${{ steps.package.outputs.commit_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail
          make_latest="false"
          if [[ "$MAKE_LATEST" == "true" ]]; then
            make_latest="true"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="IPMI_WEB ${VERSION}" \
              -f body="Manual release package for IPMI_WEB ${VERSION}." \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$make_latest"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$COMMIT_SHA" \
              -f name="IPMI_WEB ${VERSION}" \
              -f body="Manual release package for IPMI_WEB ${VERSION}." \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$make_latest"
          fi

          gh release upload "$TAG" dist/* --clobber
