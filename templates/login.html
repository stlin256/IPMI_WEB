<!DOCTYPE html>
<html lang="{{ locale }}" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app.login') }} - {{ server_name }} Ops</title>
   <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
   <link href="{{ url_for('static', filename='css/all.min.css') }}" rel="stylesheet">
   <link href="{{ url_for('static', filename='css/app-modern.css') }}?v=20260614-motion" rel="stylesheet">
   <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
   <script src="{{ url_for('static', filename='js/app-core.js') }}?v=20260614-motion"></script>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            --login-theme-x: calc(100vw - 2rem);
            --login-theme-y: 2rem;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            clip-path: circle(0 at var(--login-theme-x) var(--login-theme-y));
            background:
                radial-gradient(circle at var(--login-theme-x) var(--login-theme-y), color-mix(in srgb, var(--accent-yellow) 42%, transparent), transparent 9rem),
                radial-gradient(circle at var(--login-theme-x) var(--login-theme-y), color-mix(in srgb, var(--bg-body) 78%, transparent), transparent 62vmax),
                linear-gradient(135deg, color-mix(in srgb, var(--accent-blue) 18%, transparent), color-mix(in srgb, var(--accent-red) 16%, transparent));
            filter: blur(14px) saturate(1.2);
            mix-blend-mode: screen;
        }
        html[data-bs-theme="light"] body::before {
            mix-blend-mode: multiply;
            background:
                radial-gradient(circle at var(--login-theme-x) var(--login-theme-y), color-mix(in srgb, var(--accent-yellow) 34%, transparent), transparent 8rem),
                radial-gradient(circle at var(--login-theme-x) var(--login-theme-y), color-mix(in srgb, var(--bg-body) 74%, transparent), transparent 62vmax),
                linear-gradient(135deg, color-mix(in srgb, var(--accent-blue) 12%, transparent), color-mix(in srgb, var(--accent-red) 10%, transparent));
        }
        .login-stage {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background:
                radial-gradient(circle at 24% 18%, color-mix(in srgb, var(--accent-yellow) 9%, transparent), transparent 19rem),
                radial-gradient(circle at 78% 82%, color-mix(in srgb, var(--accent-blue) 5%, transparent), transparent 22rem);
        }
        .login-stage::before {
            content: "";
            position: absolute;
            inset: 9vh 8vw;
            z-index: 1;
            border: 1px solid color-mix(in srgb, var(--accent-yellow) 28%, transparent);
            clip-path: polygon(0 0, 68% 0, 100% 42%, 100% 100%, 28% 100%, 0 62%);
            opacity: 0.55;
        }
        .login-stage::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(180deg, transparent 34%, color-mix(in srgb, var(--accent-yellow) 7%, transparent) 100%),
                repeating-linear-gradient(90deg, color-mix(in srgb, var(--text-main) 7%, transparent) 0 1px, transparent 1px 72px),
                repeating-linear-gradient(0deg, color-mix(in srgb, var(--text-main) 5%, transparent) 0 1px, transparent 1px 72px);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.78) 48%, #000 100%);
            opacity: 0;
            transform: translate3d(0, 0.45rem, 0) scale(1.012);
            pointer-events: none;
        }
        @keyframes login-stage-drift {
            0% {
                background-position: 0 0, 0 0, 0 0;
            }
            100% {
                background-position: 0 0, 1.75rem 0, 0 1.75rem;
            }
        }
        @keyframes login-grid-reveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 0.45rem, 0) scale(1.012);
                filter: blur(0.8px) saturate(0.86);
            }
            58% {
                opacity: 0.72;
                transform: translate3d(0, 0.06rem, 0) scale(1.002);
                filter: blur(0.1px) saturate(1);
            }
            100% {
                opacity: 0.88;
                transform: translate3d(0, 0, 0) scale(1);
                filter: blur(0) saturate(1.05);
            }
        }
        @keyframes login-frame-reveal {
            0% {
                clip-path: polygon(0 0, 0 0, 0 42%, 0 100%, 0 100%, 0 62%);
                opacity: 0;
                transform: translate3d(0, 0.75rem, 0) scale(0.992);
            }
            100% {
                clip-path: polygon(0 0, 68% 0, 100% 42%, 100% 100%, 28% 100%, 0 62%);
                opacity: 0.55;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }
        @keyframes login-identity-reveal {
            0% {
                opacity: 0;
                transform: translate3d(-1.25rem, 1rem, 0);
                filter: blur(10px);
            }
            62% {
                opacity: 1;
                transform: translate3d(0.15rem, -0.15rem, 0);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
                filter: blur(0);
            }
        }
        @keyframes login-wordmark-reveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 1.35rem, 0) scale(0.94);
                filter: blur(12px);
            }
            58% {
                opacity: 1;
                transform: translate3d(0, -0.18rem, 0) scale(1.018);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
                filter: blur(0);
            }
        }
        @keyframes login-card-reveal {
            0% {
                opacity: 0;
                transform: translate3d(1.1rem, 1.35rem, 0) scale(0.975);
                filter: blur(12px);
            }
            58% {
                opacity: 1;
                transform: translate3d(-0.12rem, -0.18rem, 0) scale(1.006);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
                filter: blur(0);
            }
        }
        @keyframes login-kicker-line {
            0% { transform: scaleX(0); opacity: 0; }
            100% { transform: scaleX(1); opacity: 1; }
        }
        @keyframes login-card-glow {
            0% {
                opacity: 0;
                transform: translateX(-72%) skewX(-10deg);
            }
            36% {
                opacity: 0.48;
            }
            100% {
                opacity: 0;
                transform: translateX(72%) skewX(-10deg);
            }
        }
        @keyframes login-theme-wash {
            0% {
                opacity: 0;
                clip-path: circle(0 at var(--login-theme-x) var(--login-theme-y));
                filter: blur(16px) saturate(0.95);
            }
            32% {
                opacity: 0.68;
                clip-path: circle(44vmax at var(--login-theme-x) var(--login-theme-y));
                filter: blur(8px) saturate(1.22);
            }
            72% {
                opacity: 0.28;
                clip-path: circle(112vmax at var(--login-theme-x) var(--login-theme-y));
                filter: blur(4px) saturate(1.08);
            }
            100% {
                opacity: 0;
                clip-path: circle(142vmax at var(--login-theme-x) var(--login-theme-y));
                filter: blur(2px) saturate(1);
            }
        }
        @keyframes login-theme-stage-shift {
            0% {
                filter: brightness(0.95) saturate(0.95);
            }
            42% {
                filter: brightness(1.2) saturate(1.25);
            }
            100% {
                filter: brightness(1) saturate(1.05);
            }
        }
        @keyframes login-theme-shell-sheen {
            0% {
                opacity: 0;
                transform: translateX(-38%) skewX(-12deg);
            }
            46% {
                opacity: 0.56;
            }
            100% {
                opacity: 0;
                transform: translateX(38%) skewX(-12deg);
            }
        }
        .login-shell {
            width: min(100% - 2rem, 980px);
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            align-items: center;
            gap: clamp(1.5rem, 5vw, 4.5rem);
        }
        .login-shell::before {
            content: "";
            position: absolute;
            inset: -12% -8%;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(105deg, transparent 18%, color-mix(in srgb, var(--accent-yellow) 30%, transparent) 48%, transparent 76%);
            transform: translateX(-36%) skewX(-12deg);
            filter: blur(8px);
            mix-blend-mode: screen;
        }
        .login-identity {
            min-width: 0;
            padding-left: clamp(1.5rem, 5vw, 4.25rem);
        }
        .login-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--accent-red);
            font-family: 'SF Mono', Consolas, monospace;
            font-size: clamp(0.95rem, 1.55vw, 1.2rem);
            font-weight: 850;
            text-transform: uppercase;
        }
        .login-kicker::before {
            content: "";
            width: 2.25rem;
            height: 2px;
            background: currentColor;
        }
        .login-wordmark {
            margin: 1rem 0 0;
            color: var(--text-main);
            font-size: clamp(2.8rem, 8vw, 6.4rem);
            font-weight: 950;
            line-height: 0.9;
            letter-spacing: 0;
        }
        .login-server {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: clamp(1.12rem, 2.25vw, 1.45rem);
            font-weight: 850;
        }
        .login-card {
            width: 100%;
            padding: 1.75rem;
            border-radius: 8px !important;
            text-align: left;
            overflow: hidden;
        }
        .login-card::before {
            content: "";
            position: absolute;
            inset: -20% -45%;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(105deg, transparent 36%, color-mix(in srgb, var(--accent-yellow) 24%, transparent) 49%, transparent 62%);
            opacity: 0;
        }
        .login-card > * {
            position: relative;
            z-index: 1;
        }
        .login-stage,
        .login-stage::before,
        .login-stage::after,
        .login-wordmark,
        .login-server,
        .login-kicker,
        .login-card,
        .form-control,
        .input-group-text,
        .btn-primary {
            transition:
                background-color 252ms cubic-bezier(0.22, 0.61, 0.36, 1),
                border-color 252ms cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 252ms cubic-bezier(0.22, 0.61, 0.36, 1),
                color 252ms cubic-bezier(0.22, 0.61, 0.36, 1),
                filter 252ms cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .form-control { padding: 0.78rem 1rem; }
        .btn-primary {
            min-height: 2.85rem;
            font-weight: 850;
        }
        @media (prefers-reduced-motion: no-preference) {
            .login-stage::after {
                animation:
                    login-grid-reveal 120ms cubic-bezier(0.18, 0.84, 0.26, 1) both 32ms,
                    login-stage-drift 15s ease-in-out infinite alternate 120ms;
            }
            .login-stage::before {
                animation: login-frame-reveal 1.36s cubic-bezier(0.18, 0.84, 0.26, 1) both 784ms;
            }
            .login-identity {
                animation: login-identity-reveal 1.16s cubic-bezier(0.18, 0.84, 0.26, 1) both 1.08s;
            }
            .login-kicker::before {
                transform-origin: left center;
                animation: login-kicker-line 840ms cubic-bezier(0.16, 1, 0.3, 1) both 1.376s;
            }
            .login-wordmark {
                transform-origin: left bottom;
                animation: login-wordmark-reveal 1.24s cubic-bezier(0.18, 0.84, 0.26, 1) both 1.48s;
            }
            .login-server {
                animation: login-identity-reveal 1.04s cubic-bezier(0.18, 0.84, 0.26, 1) both 1.744s;
            }
            .login-card {
                animation: login-card-reveal 1.24s cubic-bezier(0.18, 0.84, 0.26, 1) both 1.88s;
            }
            html.ipmi-motion-enabled .login-shell .login-card.ipmi-motion-target {
                opacity: 0;
                transform: translate3d(1.1rem, 1.35rem, 0) scale(0.975);
                filter: blur(12px);
            }
            html.ipmi-motion-enabled.ipmi-page-ready .login-shell .login-card.ipmi-motion-target {
                animation: login-card-reveal 1.24s cubic-bezier(0.18, 0.84, 0.26, 1) both 1.88s;
            }
            .login-card::before {
                animation: login-card-glow 2.16s cubic-bezier(0.16, 1, 0.3, 1) both 2.28s;
            }
            html.login-theme-shifting body::before {
                animation: login-theme-wash 384ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            html.login-theme-shifting .login-stage {
                animation: login-theme-stage-shift 384ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            html.login-theme-shifting .login-shell::before {
                animation: login-theme-shell-sheen 408ms cubic-bezier(0.16, 1, 0.3, 1) both 21ms;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            body::before,
            .login-stage,
            .login-stage::before,
            .login-stage::after,
            .login-shell::before,
            .login-identity,
            .login-kicker::before,
            .login-wordmark,
            .login-server,
            .login-card,
            .login-card::before {
                animation: none !important;
            }
            .login-stage::after {
                opacity: 0.88;
                transform: none;
                filter: none;
            }
        }
        @media (max-width: 820px) {
            body { overflow-y: auto; }
            .login-shell {
                grid-template-columns: 1fr;
                padding: 5rem 0 2rem;
            }
            .login-identity {
                text-align: left;
                padding-left: clamp(1.5rem, 7vw, 3rem);
            }
            .login-card {
                max-width: 420px;
                margin: 0 auto;
            }
        }
        @media (max-width: 480px) {
            .login-shell { width: min(100% - 1.5rem, 420px); }
            .login-identity { padding-left: 0.75rem; }
            .login-wordmark { font-size: 3.1rem; }
            .login-card { padding: 1.35rem; }
        }
    </style>
</head>
<body>
    <div class="login-stage"></div>
    <main class="login-shell">
        <section class="login-identity">
            <div class="login-kicker">{{ server_name }}</div>
            <h1 class="login-wordmark">IPMI<br>WEB</h1>
            <div class="login-server">Ops Console</div>
        </section>
        <section class="login-card position-relative" aria-label="{{ t('app.login') }}">
            {% if error %}
            <div id="login-error" class="alert alert-danger py-2 small border-0 bg-danger bg-opacity-25 text-white">{{ error }}</div>
            {% endif %}

            <form id="login-form" method="POST">
                <div class="mb-4 text-start">
                    <label class="form-label text-muted small text-uppercase fw-bold" data-i18n="app.password">{{ t('app.password') }}</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" autofocus>
                    </div>
                </div>
                <button id="login-btn" type="submit" class="btn btn-primary w-100" data-i18n="app.login">{{ t('app.login') }}</button>
            </form>
        </section>
    </main>

    <script>
        window.I18N_MESSAGES = {{ i18n_messages | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        // 从后端安全获取等待时间
        const waitSeconds = parseInt("{{ wait_seconds | default(0) }}");
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('login-error');
        const loginForm = document.getElementById('login-form');
        let loginThemeTimer = null;
        let loginThemeSwitchTimer = null;
        let loginThemeClickSwitch = false;

        if (waitSeconds > 0) {
            startCooldown(waitSeconds);
        }

        function startCooldown(seconds) {
            let remaining = seconds;
            loginBtn.disabled = true;
            
            const originalBtnText = loginBtn.innerText;
            const originalErrorText = errorMsg ? errorMsg.innerText : "";

            const timer = setInterval(() => {
                remaining--;
                loginBtn.innerText = `${t('app.retry')} (${remaining}s)`;
                if (errorMsg) {
                    errorMsg.innerHTML = `${originalErrorText}<br><div class="mt-2 pt-2 border-top border-white border-opacity-10 small opacity-75"><i class="fas fa-clock me-1"></i>${t('app.retryAfter', {seconds: remaining})}</div>`;
                }

                if (remaining <= 0) {
                    clearInterval(timer);
                    loginBtn.disabled = false;
                    loginBtn.innerText = originalBtnText;
                    if (errorMsg && originalErrorText.includes("Invalid")) {
                        errorMsg.style.display = 'none';
                    } else if (errorMsg) {
                        errorMsg.innerText = originalErrorText;
                    }
                }
            }, 1000);
        }

        // 拦截快速点击
        loginForm.onsubmit = () => {
            if (loginBtn.disabled) return false;
            loginBtn.disabled = true;
            loginBtn.innerText = t('app.verifying');
        };

        function themeTogglePoint() {
            const toggle = document.querySelector('.ipmi-theme-toggle');
            if (!toggle) return;
            const rect = toggle.getBoundingClientRect();
            document.body.style.setProperty('--login-theme-x', `${rect.left + rect.width / 2}px`);
            document.body.style.setProperty('--login-theme-y', `${rect.top + rect.height / 2}px`);
        }

        function runLoginThemeAnimation() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const root = document.documentElement;
            themeTogglePoint();
            root.classList.remove('login-theme-shifting');
            void root.offsetWidth;
            root.classList.add('login-theme-shifting');
            clearTimeout(loginThemeTimer);
            loginThemeTimer = setTimeout(() => {
                root.classList.remove('login-theme-shifting');
            }, 432);
        }

        document.addEventListener('click', (event) => {
            const target = event.target instanceof Element ? event.target : null;
            const toggle = target ? target.closest('.ipmi-theme-toggle') : null;
            if (!toggle || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            event.preventDefault();
            event.stopImmediatePropagation();

            const root = document.documentElement;
            if (root.classList.contains('login-theme-shifting')) return;

            const currentTheme = window.IPMITheme ? window.IPMITheme.get() : (root.getAttribute('data-bs-theme') || 'light');
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            runLoginThemeAnimation();
            clearTimeout(loginThemeSwitchTimer);
            loginThemeSwitchTimer = setTimeout(() => {
                loginThemeClickSwitch = true;
                if (window.IPMITheme && typeof window.IPMITheme.set === 'function') {
                    window.IPMITheme.set(nextTheme);
                } else {
                    root.setAttribute('data-bs-theme', nextTheme);
                }
                loginThemeClickSwitch = false;
            }, 84);
        }, true);

        window.addEventListener('ipmi:theme-change', () => {
            if (loginThemeClickSwitch) return;
            runLoginThemeAnimation();
        });
    </script>
</body>
</html>
