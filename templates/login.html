<!DOCTYPE html>
<html lang="{{ locale }}" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app.login') }} - {{ server_name }} Ops</title>
   <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
   <link href="{{ url_for('static', filename='css/all.min.css') }}" rel="stylesheet">
   <link href="{{ url_for('static', filename='css/app-modern.css') }}?v=20260614-motion" rel="stylesheet">
   <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
   <script src="{{ url_for('static', filename='js/app-core.js') }}?v=20260614-motion"></script>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .login-stage {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 24% 18%, color-mix(in srgb, var(--accent-yellow) 9%, transparent), transparent 19rem),
                repeating-linear-gradient(90deg, color-mix(in srgb, var(--text-main) 4%, transparent) 0 1px, transparent 1px 72px),
                repeating-linear-gradient(0deg, color-mix(in srgb, var(--text-main) 3%, transparent) 0 1px, transparent 1px 72px);
        }
        .login-stage::before {
            content: "";
            position: absolute;
            inset: 9vh 8vw;
            border: 1px solid color-mix(in srgb, var(--accent-yellow) 28%, transparent);
            clip-path: polygon(0 0, 68% 0, 100% 42%, 100% 100%, 28% 100%, 0 62%);
            opacity: 0.55;
        }
        @keyframes login-stage-drift {
            0% {
                background-position: 0 0, 0 0, 0 0;
                filter: saturate(0.96);
            }
            100% {
                background-position: 2rem -1rem, 1.5rem 0, 0 1.5rem;
                filter: saturate(1.08);
            }
        }
        @keyframes login-frame-reveal {
            0% {
                clip-path: polygon(0 0, 0 0, 0 42%, 0 100%, 0 100%, 0 62%);
                opacity: 0;
                transform: translate3d(0, 0.75rem, 0) scale(0.992);
            }
            100% {
                clip-path: polygon(0 0, 68% 0, 100% 42%, 100% 100%, 28% 100%, 0 62%);
                opacity: 0.55;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }
        @keyframes login-identity-reveal {
            0% {
                opacity: 0;
                transform: translate3d(-1.25rem, 1rem, 0);
                filter: blur(10px);
            }
            62% {
                opacity: 1;
                transform: translate3d(0.15rem, -0.15rem, 0);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
                filter: blur(0);
            }
        }
        @keyframes login-wordmark-reveal {
            0% {
                opacity: 0;
                transform: translate3d(0, 1.35rem, 0) scale(0.94);
                filter: blur(12px);
            }
            58% {
                opacity: 1;
                transform: translate3d(0, -0.18rem, 0) scale(1.018);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
                filter: blur(0);
            }
        }
        @keyframes login-card-reveal {
            0% {
                opacity: 0;
                transform: translate3d(1.1rem, 1.35rem, 0) scale(0.975);
                filter: blur(12px);
            }
            58% {
                opacity: 1;
                transform: translate3d(-0.12rem, -0.18rem, 0) scale(1.006);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
                filter: blur(0);
            }
        }
        @keyframes login-kicker-line {
            0% { transform: scaleX(0); opacity: 0; }
            100% { transform: scaleX(1); opacity: 1; }
        }
        @keyframes login-card-glow {
            0% {
                opacity: 0;
                transform: translateX(-72%) skewX(-10deg);
            }
            36% {
                opacity: 0.48;
            }
            100% {
                opacity: 0;
                transform: translateX(72%) skewX(-10deg);
            }
        }
        .login-shell {
            width: min(100% - 2rem, 980px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            align-items: center;
            gap: clamp(1.5rem, 5vw, 4.5rem);
        }
        .login-identity {
            min-width: 0;
            padding-left: clamp(1.5rem, 5vw, 4.25rem);
        }
        .login-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--accent-red);
            font-family: 'SF Mono', Consolas, monospace;
            font-size: clamp(0.95rem, 1.55vw, 1.2rem);
            font-weight: 850;
            text-transform: uppercase;
        }
        .login-kicker::before {
            content: "";
            width: 2.25rem;
            height: 2px;
            background: currentColor;
        }
        .login-wordmark {
            margin: 1rem 0 0;
            color: var(--text-main);
            font-size: clamp(2.8rem, 8vw, 6.4rem);
            font-weight: 950;
            line-height: 0.9;
            letter-spacing: 0;
        }
        .login-server {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: clamp(1.12rem, 2.25vw, 1.45rem);
            font-weight: 850;
        }
        .login-card {
            width: 100%;
            padding: 1.75rem;
            border-radius: 8px !important;
            text-align: left;
            overflow: hidden;
        }
        .login-card::before {
            content: "";
            position: absolute;
            inset: -20% -45%;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(105deg, transparent 36%, color-mix(in srgb, var(--accent-yellow) 24%, transparent) 49%, transparent 62%);
            opacity: 0;
        }
        .login-card > * {
            position: relative;
            z-index: 1;
        }
        .form-control { padding: 0.78rem 1rem; }
        .btn-primary {
            min-height: 2.85rem;
            font-weight: 850;
        }
        @media (prefers-reduced-motion: no-preference) {
            .login-stage {
                animation: login-stage-drift 22s ease-in-out infinite alternate;
            }
            .login-stage::before {
                animation: login-frame-reveal 1.9s cubic-bezier(0.18, 0.84, 0.26, 1) both 180ms;
            }
            .login-identity {
                animation: login-identity-reveal 1.45s cubic-bezier(0.18, 0.84, 0.26, 1) both 240ms;
            }
            .login-kicker::before {
                transform-origin: left center;
                animation: login-kicker-line 1.25s cubic-bezier(0.16, 1, 0.3, 1) both 640ms;
            }
            .login-wordmark {
                transform-origin: left bottom;
                animation: login-wordmark-reveal 1.65s cubic-bezier(0.18, 0.84, 0.26, 1) both 440ms;
            }
            .login-server {
                animation: login-identity-reveal 1.35s cubic-bezier(0.18, 0.84, 0.26, 1) both 760ms;
            }
            .login-card {
                animation: login-card-reveal 1.65s cubic-bezier(0.18, 0.84, 0.26, 1) both 780ms;
            }
            html.ipmi-motion-enabled .login-shell .login-card.ipmi-motion-target {
                opacity: 0;
                transform: translate3d(1.1rem, 1.35rem, 0) scale(0.975);
                filter: blur(12px);
            }
            html.ipmi-motion-enabled.ipmi-page-ready .login-shell .login-card.ipmi-motion-target {
                animation: login-card-reveal 1.65s cubic-bezier(0.18, 0.84, 0.26, 1) both 780ms;
            }
            .login-card::before {
                animation: login-card-glow 2.9s cubic-bezier(0.16, 1, 0.3, 1) both 1.15s;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .login-stage,
            .login-stage::before,
            .login-identity,
            .login-kicker::before,
            .login-wordmark,
            .login-server,
            .login-card,
            .login-card::before {
                animation: none !important;
            }
        }
        @media (max-width: 820px) {
            body { overflow-y: auto; }
            .login-shell {
                grid-template-columns: 1fr;
                padding: 5rem 0 2rem;
            }
            .login-identity {
                text-align: left;
                padding-left: clamp(1.5rem, 7vw, 3rem);
            }
            .login-card {
                max-width: 420px;
                margin: 0 auto;
            }
        }
        @media (max-width: 480px) {
            .login-shell { width: min(100% - 1.5rem, 420px); }
            .login-identity { padding-left: 0.75rem; }
            .login-wordmark { font-size: 3.1rem; }
            .login-card { padding: 1.35rem; }
        }
    </style>
</head>
<body>
    <div class="login-stage"></div>
    <main class="login-shell">
        <section class="login-identity">
            <div class="login-kicker">{{ server_name }}</div>
            <h1 class="login-wordmark">IPMI<br>WEB</h1>
            <div class="login-server">Ops Console</div>
        </section>
        <section class="login-card position-relative" aria-label="{{ t('app.login') }}">
            {% if error %}
            <div id="login-error" class="alert alert-danger py-2 small border-0 bg-danger bg-opacity-25 text-white">{{ error }}</div>
            {% endif %}

            <form id="login-form" method="POST">
                <div class="mb-4 text-start">
                    <label class="form-label text-muted small text-uppercase fw-bold" data-i18n="app.password">{{ t('app.password') }}</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" autofocus>
                    </div>
                </div>
                <button id="login-btn" type="submit" class="btn btn-primary w-100" data-i18n="app.login">{{ t('app.login') }}</button>
            </form>
        </section>
    </main>

    <script>
        window.I18N_MESSAGES = {{ i18n_messages | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        // 从后端安全获取等待时间
        const waitSeconds = parseInt("{{ wait_seconds | default(0) }}");
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('login-error');
        const loginForm = document.getElementById('login-form');

        if (waitSeconds > 0) {
            startCooldown(waitSeconds);
        }

        function startCooldown(seconds) {
            let remaining = seconds;
            loginBtn.disabled = true;
            
            const originalBtnText = loginBtn.innerText;
            const originalErrorText = errorMsg ? errorMsg.innerText : "";

            const timer = setInterval(() => {
                remaining--;
                loginBtn.innerText = `${t('app.retry')} (${remaining}s)`;
                if (errorMsg) {
                    errorMsg.innerHTML = `${originalErrorText}<br><div class="mt-2 pt-2 border-top border-white border-opacity-10 small opacity-75"><i class="fas fa-clock me-1"></i>${t('app.retryAfter', {seconds: remaining})}</div>`;
                }

                if (remaining <= 0) {
                    clearInterval(timer);
                    loginBtn.disabled = false;
                    loginBtn.innerText = originalBtnText;
                    if (errorMsg && originalErrorText.includes("Invalid")) {
                        errorMsg.style.display = 'none';
                    } else if (errorMsg) {
                        errorMsg.innerText = originalErrorText;
                    }
                }
            }, 1000);
        }

        // 拦截快速点击
        loginForm.onsubmit = () => {
            if (loginBtn.disabled) return false;
            loginBtn.disabled = true;
            loginBtn.innerText = t('app.verifying');
        };
    </script>
</body>
</html>
