<!DOCTYPE html>
<html lang="{{ locale }}" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app.login') }} - {{ server_name }} Ops</title>
   <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
   <link href="{{ url_for('static', filename='css/all.min.css') }}" rel="stylesheet">
   <link href="{{ url_for('static', filename='css/app-modern.css') }}" rel="stylesheet">
   <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .login-stage {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(115deg, transparent 0 44%, color-mix(in srgb, var(--accent-cyan) 16%, transparent) 44% 45%, transparent 45%),
                linear-gradient(65deg, transparent 0 55%, color-mix(in srgb, var(--accent-magenta) 14%, transparent) 55% 56%, transparent 56%),
                repeating-linear-gradient(90deg, color-mix(in srgb, var(--text-main) 4%, transparent) 0 1px, transparent 1px 72px),
                repeating-linear-gradient(0deg, color-mix(in srgb, var(--text-main) 3%, transparent) 0 1px, transparent 1px 72px);
        }
        .login-stage::before {
            content: "";
            position: absolute;
            inset: 9vh 8vw;
            border: 1px solid color-mix(in srgb, var(--accent-yellow) 28%, transparent);
            clip-path: polygon(0 0, 68% 0, 100% 42%, 100% 100%, 28% 100%, 0 62%);
            opacity: 0.55;
        }
        .login-shell {
            width: min(100% - 2rem, 980px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            align-items: center;
            gap: clamp(1.5rem, 5vw, 4.5rem);
        }
        .login-identity {
            min-width: 0;
        }
        .login-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--accent-yellow);
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 0.82rem;
            font-weight: 850;
            text-transform: uppercase;
        }
        .login-kicker::before {
            content: "";
            width: 2.25rem;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-yellow));
        }
        .login-wordmark {
            margin: 1rem 0 0;
            color: var(--text-main);
            font-size: clamp(2.8rem, 8vw, 6.4rem);
            font-weight: 950;
            line-height: 0.9;
            letter-spacing: 0;
        }
        .login-server {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 750;
        }
        .login-card {
            width: 100%;
            padding: 2rem;
            border-radius: 8px !important;
        }
        .login-mark {
            display: inline-grid;
            place-items: center;
            width: 3.5rem;
            height: 3.5rem;
            margin-bottom: 1.25rem;
            border-radius: 8px;
            color: #07100d;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-yellow), var(--accent-magenta));
            box-shadow: 0 16px 34px color-mix(in srgb, var(--accent-cyan) 24%, transparent);
        }
        .logo-icon { font-size: 1.55rem; }
        .form-control { padding: 0.78rem 1rem; }
        .btn-primary {
            min-height: 2.85rem;
            font-weight: 850;
        }
        @media (max-width: 820px) {
            body { overflow-y: auto; }
            .login-shell {
                grid-template-columns: 1fr;
                padding: 5rem 0 2rem;
            }
            .login-identity {
                text-align: left;
            }
            .login-card {
                max-width: 420px;
                margin: 0 auto;
            }
        }
        @media (max-width: 480px) {
            .login-shell { width: min(100% - 1.5rem, 420px); }
            .login-wordmark { font-size: 3.1rem; }
            .login-card { padding: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="login-stage"></div>
    <main class="login-shell">
        <section class="login-identity">
            <div class="login-kicker">{{ server_name }}</div>
            <h1 class="login-wordmark">IPMI<br>WEB</h1>
            <div class="login-server">Ops Console</div>
        </section>
        <section class="login-card text-center position-relative">
            <div class="login-mark"><i class="fas fa-server logo-icon"></i></div>
            <h2 class="h4 mb-4 fw-bold" data-i18n="app.loginTitle">{{ t('app.loginTitle') }}</h2>

            {% if error %}
            <div id="login-error" class="alert alert-danger py-2 small border-0 bg-danger bg-opacity-25 text-white">{{ error }}</div>
            {% endif %}

            <form id="login-form" method="POST">
                <div class="mb-4 text-start">
                    <label class="form-label text-muted small text-uppercase fw-bold" data-i18n="app.password">{{ t('app.password') }}</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" autofocus>
                    </div>
                </div>
                <button id="login-btn" type="submit" class="btn btn-primary w-100" data-i18n="app.login">{{ t('app.login') }}</button>
            </form>
        </section>
    </main>

    <script>
        window.I18N_MESSAGES = {{ i18n_messages | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        // 从后端安全获取等待时间
        const waitSeconds = parseInt("{{ wait_seconds | default(0) }}");
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('login-error');
        const loginForm = document.getElementById('login-form');

        if (waitSeconds > 0) {
            startCooldown(waitSeconds);
        }

        function startCooldown(seconds) {
            let remaining = seconds;
            loginBtn.disabled = true;
            
            const originalBtnText = loginBtn.innerText;
            const originalErrorText = errorMsg ? errorMsg.innerText : "";

            const timer = setInterval(() => {
                remaining--;
                loginBtn.innerText = `${t('app.retry')} (${remaining}s)`;
                if (errorMsg) {
                    errorMsg.innerHTML = `${originalErrorText}<br><div class="mt-2 pt-2 border-top border-white border-opacity-10 small opacity-75"><i class="fas fa-clock me-1"></i>${t('app.retryAfter', {seconds: remaining})}</div>`;
                }

                if (remaining <= 0) {
                    clearInterval(timer);
                    loginBtn.disabled = false;
                    loginBtn.innerText = originalBtnText;
                    if (errorMsg && originalErrorText.includes("Invalid")) {
                        errorMsg.style.display = 'none';
                    } else if (errorMsg) {
                        errorMsg.innerText = originalErrorText;
                    }
                }
            }, 1000);
        }

        // 拦截快速点击
        loginForm.onsubmit = () => {
            if (loginBtn.disabled) return false;
            loginBtn.disabled = true;
            loginBtn.innerText = t('app.verifying');
        };
    </script>
</body>
</html>
